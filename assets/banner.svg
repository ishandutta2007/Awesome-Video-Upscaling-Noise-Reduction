<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Scanline / Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .metric-value {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 20px;
      fill: #38bdf8;
    }
    .metric-label {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(420px); opacity: 0.2; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    .dynamic-orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 950px 140px;
    }
    .dynamic-orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 150px 300px;
    }
    .dynamic-scan {
      animation: scanLine 6s linear infinite;
    }
    .float-item {
      animation: floatParticle 5s ease-in-out infinite alternate;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Light Orbs (Background dynamic layer) -->
  <circle class="dynamic-orb-1" cx="980" cy="130" r="180" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle class="dynamic-orb-2" cx="160" cy="280" r="160" fill="#8b5cf6" filter="url(#neonGlow)" />

  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Dynamic Scanning Beam (Behind text, subtle) -->
  <g class="dynamic-scan">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad)" stroke-width="2" filter="url(#softGlow)" />
  </g>

  <!-- Decorative Border -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Dynamic Graphic Accent: Resolution & Denoise Matrix (Right side) -->
  <g class="float-item" transform="translate(860, 65)">
    <!-- Glassmorphic Card -->
    <rect width="280" height="280" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#softGlow)" />

    <!-- Waveform / Spectrum Visualization -->
    <g transform="translate(25, 30)">
      <text x="0" y="0" class="metric-label">Neural Enhancement Pipeline</text>
      <!-- Before (Noisy/Low-Res) -->
      <path d="M 10 40 Q 25 20 40 45 T 70 30 T 100 50 T 130 25 T 160 45 T 190 35 T 220 50" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />
      <text x="10" y="65" font-size="10" fill="#f87171" font-family="sans-serif">RAW NOISY INPUT (480p / ISO 12800)</text>

      <!-- Transformation Arrow -->
      <path d="M 115 80 L 115 105 M 108 98 L 115 105 L 122 98" fill="none" stroke="#38bdf8" stroke-width="2.5" />

      <!-- After (Upscaled/Clean 4K) -->
      <path d="M 10 140 C 40 110, 80 170, 120 120 C 160 170, 200 110, 230 135" fill="none" stroke="#10b981" stroke-width="3" filter="url(#softGlow)" />
      <text x="10" y="165" font-size="10" fill="#34d399" font-family="sans-serif">AI RECONSTRUCTED 4K 60FPS HDR</text>

      <!-- Mini stats grid inside card -->
      <g transform="translate(0, 185)">
        <rect width="105" height="45" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
        <text x="12" y="20" class="metric-value">4× / 8×</text>
        <text x="12" y="36" class="metric-label">Super-Res</text>

        <rect x="120" width="105" height="45" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
        <text x="132" y="20" class="metric-value">+14.2 dB</text>
        <text x="132" y="36" class="metric-label">PSNR Gain</text>
      </g>
    </g>
  </g>

  <!-- Foreground Content (Always crisp & clearly visible) -->
  <g transform="translate(80, 80)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="20" class="badge-text" fill="#38bdf8">VIDEO AI &amp; SUPER-RESOLUTION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">
      Awesome Video Upscaling &amp;
    </text>
    <text x="0" y="130" class="title-text" fill="url(#accentGrad)">
      Noise Reduction 🚀✨
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle-text">
      Curated directory of state-of-the-art Neural Super-Resolution engines,
    </text>
    <text x="0" y="200" class="subtitle-text">
      temporal VSR models, zero-loss denoisers, SaaS platforms &amp; open-source toolkits.
    </text>

    <!-- Quick Badges / Feature Tags -->
    <g transform="translate(0, 235)">
      <!-- Badge 1 -->
      <rect width="130" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="14" y="21" class="badge-text">🎥 4K/8K Upscaling</text>

      <!-- Badge 2 -->
      <rect x="142" width="135" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="156" y="21" class="badge-text">🔬 Temporal VSR</text>

      <!-- Badge 3 -->
      <rect x="289" width="140" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="303" y="21" class="badge-text">⚡ AI Denoising</text>

      <!-- Badge 4 -->
      <rect x="441" width="155" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="455" y="21" class="badge-text">🎞️ Frame Interpolation</text>
    </g>
  </g>
</svg>
