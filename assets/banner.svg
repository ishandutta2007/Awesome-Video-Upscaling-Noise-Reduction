<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".05"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity=".3"/></pattern><filter id="neonGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.6}}@keyframes scanLine{0%{transform:translateY(0);opacity:.2}50%{opacity:.8}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(8px)}}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.badge-text,.metric-label,.metric-value,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:17px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.metric-value{font-weight:700;font-size:20px;fill:#38bdf8}.metric-label{font-weight:500;font-size:11px;fill:#64748b;text-transform:uppercase;letter-spacing:.8px}.dynamic-orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:950px 140px}.dynamic-orb-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:150px 300px}.dynamic-scan{animation:scanLine 6s linear infinite}.float-item{animation:floatParticle 5s ease-in-out infinite alternate}</style><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><circle cx="980" cy="130" r="180" fill="#38bdf8" class="dynamic-orb-1" filter="url(#neonGlow)"/><circle cx="160" cy="280" r="160" fill="#8b5cf6" class="dynamic-orb-2" filter="url(#neonGlow)"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="dynamic-scan"><line x1="0" x2="1200" y1="0" y2="0" stroke="url(#accentGrad)" stroke-width="2" filter="url(#softGlow)"/></g><rect width="1196" height="416" x="2" y="2" fill="none" stroke="#334155" stroke-opacity=".7" stroke-width="1.5" rx="15"/><g class="float-item" transform="translate(860, 65)"><rect width="280" height="280" fill="#0f172a" fill-opacity=".75" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" filter="url(#softGlow)" rx="20"/><g><text x="0" y="0" class="metric-label" transform="translate(25, 30)">Neural Enhancement Pipeline</text><path fill="none" stroke="#ef4444" stroke-dasharray="3 3" stroke-width="2" d="M 10 40 Q 25 20 40 45 T 70 30 T 100 50 T 130 25 T 160 45 T 190 35 T 220 50" opacity=".7" transform="translate(25, 30)"/><text x="10" y="65" fill="#f87171" font-family="sans-serif" font-size="10" transform="translate(25, 30)">RAW NOISY INPUT (480p / ISO 12800)</text><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 115 80 L 115 105 M 108 98 L 115 105 L 122 98" transform="translate(25, 30)"/><path fill="none" stroke="#10b981" stroke-width="3" d="M 10 140 C 40 110, 80 170, 120 120 C 160 170, 200 110, 230 135" filter="url(#softGlow)" transform="translate(25, 30)"/><text x="10" y="165" fill="#34d399" font-family="sans-serif" font-size="10" transform="translate(25, 30)">AI RECONSTRUCTED 4K 60FPS HDR</text><g transform="translate(25, 30) translate(0, 185)"><rect width="105" height="45" fill="#1e293b" fill-opacity=".6" stroke="#475569" stroke-width="1" rx="8"/><text x="12" y="20" class="metric-value">4× / 8×</text><text x="12" y="36" class="metric-label">Super-Res</text><rect width="105" height="45" x="120" fill="#1e293b" fill-opacity=".6" stroke="#475569" stroke-width="1" rx="8"/><text x="132" y="20" class="metric-value">+14.2 dB</text><text x="132" y="36" class="metric-label">PSNR Gain</text></g></g></g><g><g transform="translate(80, 80) translate(0, 0)"><rect width="250" height="30" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="5" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="30" y="20" fill="#38bdf8" class="badge-text">VIDEO AI &amp; SUPER-RESOLUTION</text></g><text x="0" y="80" class="title-text" transform="translate(80, 80)">Awesome Video Upscaling &amp;</text><text x="0" y="130" fill="url(#accentGrad)" class="title-text" transform="translate(80, 80)">Noise Reduction 🚀✨</text><text x="0" y="175" class="subtitle-text" transform="translate(80, 80)">Curated directory of state-of-the-art Neural Super-Resolution engines,</text><text x="0" y="200" class="subtitle-text" transform="translate(80, 80)">temporal VSR models, zero-loss denoisers, SaaS platforms &amp; open-source toolkits.</text><g transform="translate(80, 80) translate(0, 235)"><rect width="130" height="32" fill="#0f172a" stroke="#475569" stroke-width="1" rx="6"/><text x="14" y="21" class="badge-text">🎥 4K/8K Upscaling</text><rect width="135" height="32" x="142" fill="#0f172a" stroke="#475569" stroke-width="1" rx="6"/><text x="156" y="21" class="badge-text">🔬 Temporal VSR</text><rect width="140" height="32" x="289" fill="#0f172a" stroke="#475569" stroke-width="1" rx="6"/><text x="303" y="21" class="badge-text">⚡ AI Denoising</text><rect width="155" height="32" x="441" fill="#0f172a" stroke="#475569" stroke-width="1" rx="6"/><text x="455" y="21" class="badge-text">🎞️ Frame Interpolation</text></g></g></svg>